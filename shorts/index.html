<!DOCTYPE html>

        </header>

        <main class="content-area">
            <section class="main-grid-shell">
                <div class="main-grid" id="mainGrid"></div>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./script.js"></script>
</body>
</html>
